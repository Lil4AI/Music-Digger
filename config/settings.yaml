# EDMサブジャンル自動判定システム — 設定ファイル
# このファイルは src/config.py から読み込まれる

# 音声処理
sample_rate: 44100                  # サンプリングレート (Hz)
stems: [drums, bass, subbass, other]  # ステム分離後のブランチ名
subbass_cutoff_hz: 120              # bass/subbass帯域分割のカットオフ周波数 (Hz)
drop_segment_seconds: 18            # ドロップ検出のウィンドウ幅 (秒)

# ジャンル分類
genre_labels:
  - heavy_dubstep   # Brostep含む。Excision / Zomboy / Skrillex 系
  - color_bass      # 実験的・変態的な音作り。Ace Aura / Sharks / Skybreak 系
  - riddim          # 最小限の反復パターン。Chime / Infekt / Graphyt 系
  - bass_house      # 4つ打きキック＋うねるベース。Valentino Khan / AC Slater 系
  - future_bass     # 浮遊感のあるコードシンセ。Flume / San Holo / Odesza 系
  - melodic_dubstep # 感情的・メロディ重視のダブステップ。Seven Lions / ILLENIUM / MitiS 系
  - progressive_house # 展開重視のハウス。Eric Prydz / Innellea 系
  - drum_and_bass   # 170BPM前後。Chase & Status / Pendulum 系
  - trap            # フェスティバル〜ダークトラップ。RL Grime / isoxo / Juelz 系
model_version: "v0.2"               # 9ジャンル対応版

# 収集パイプライン設定
collector:
  request_delay_sec: 3              # SoundCloud APIリクエスト間のスリープ (秒)
  max_concurrency: 2                # 同時ダウンロードの最大数
  min_follower_count: 500           # この値未満のアップローダーは除外

# ディレクトリパス（プロジェクトルートからの相対パス）
paths:
  raw_audio: "data/raw_audio"
  stems: "data/stems"
  features: "data/features"
  labels: "data/labels"
  web_audio: "data/web_audio"
  db: "db"
  models: "models"
  logs: "logs"
